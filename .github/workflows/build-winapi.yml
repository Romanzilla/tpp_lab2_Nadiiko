name: Build WinAPI Lab 2 (Variant 18)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Compile Task 1 & Task 2 Windows executables
        run: make all

      - name: Upload compiled .exe files
        uses: actions/upload-artifact@v4
        with:
          name: WinAPI-Lab2-Variant18-EXE
          path: |
            task1.exe
            task2.exe
